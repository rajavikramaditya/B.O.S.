# B.O.S. — one command to run the whole platform.
#
#   cp .env.example .env      # optional: everything can also be set in the dashboard
#   docker compose up -d
#   open http://localhost:8000
#
# Data (databases + generated secret key) lives in the `bos-data` volume.

services:
  bos:
    build: .
    image: bos:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${BOS_PORT:-8000}:8000"
    volumes:
      - bos-data:/data

  # Optional PostgreSQL for larger workspaces:
  #   docker compose --profile postgres up -d
  # and set in .env:
  #   DATABASE_URL=postgresql+psycopg://bos:bos@postgres:5432/bos
  #   MEMORY_DATABASE_URL=postgresql+psycopg://bos:bos@postgres:5432/bos_memory
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: bos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bos}
      POSTGRES_DB: bos
    volumes:
      - bos-postgres:/var/lib/postgresql/data
      - ./backend/migrations/init_memory_db.sql:/docker-entrypoint-initdb.d/10-memory-db.sql:ro

volumes:
  bos-data:
  bos-postgres:
