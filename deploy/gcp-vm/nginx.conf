events {}

# SNI router: Route admin to neena-admin-proxy :8443. Other hostnames stay on AzuraCast loopback :4443.
stream {
  map $ssl_preread_server_name $orai_https_upstream {
    admin.orairadio.in 127.0.0.1:8443;
    default             127.0.0.1:4443;
  }

  server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $orai_https_upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 600s;
  }
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 8443 ssl;
    server_name admin.orairadio.in _;
    ssl_certificate /etc/nginx/certs/neena.crt;
    ssl_certificate_key /etc/nginx/certs/neena.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # Command Center HTML entry must never be cached, so new deploys show
    # immediately (versioned JS/CSS below keep normal caching).
    location = / {
      root /opt/orai-radio-command-center/frontend;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files /index.html =404;
    }

    location ~* \.html$ {
      root /opt/orai-radio-command-center/frontend;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    # Build/version proof endpoint: never cached so owner can always read the
    # exact deployed build straight from the served static path (no JS needed).
    location = /__cc-version.json {
      root /opt/orai-radio-command-center/frontend;
      default_type application/json;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files /__cc-version.json =404;
    }

    location / {
      root /opt/orai-radio-command-center/frontend;
      index index.html;
      try_files $uri $uri/ =404;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      
      # WebSocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_connect_timeout 5s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
    }

    location = /healthz {
      proxy_pass http://127.0.0.1:8080/healthz;
      proxy_set_header Host $host;
    }

    location = /healthz-admin-shell {
      default_type application/json;
      return 200 '{"ok": true, "service": "nginx-admin-shell"}';
    }
  }
}
