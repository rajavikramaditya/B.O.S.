# Orai public edge vhosts — api + config + Command Center admin.
# stream.orairadio.in intentionally NOT defined here:
# it continues to use AzuraCast default.vhost + station nginx.conf /listen/*.
#
# Domain map (permanent):
#   admin.orairadio.in  → Neena Command Center (SNI → neena-admin-proxy :8443)
#   azura.orairadio.in  → AzuraCast UI/API (SNI default → AzuraCast :4443)
#   api.orairadio.in    → public app API only
#   stream.orairadio.in → public radio stream
#   config.orairadio.in → backup app-config.json
#   orairadio.in / www  → reserved (404 until website)
#
# Preferred permanent Command Center URL: https://admin.orairadio.in
# Preferred AzuraCast URL: https://azura.orairadio.in
# (IP:8443 remains emergency CC fallback only.)

upstream neena_backend_public {
    server neena-backend:8000;
    keepalive 8;
}

server {
    listen 80;
    listen 4443 ssl;
    http2 on;
    server_name api.orairadio.in;

    ssl_certificate     /var/azuracast/storage/acme/ssl.crt;
    ssl_certificate_key /var/azuracast/storage/acme/ssl.key;

    location /.well-known/acme-challenge/ {
        alias /var/azuracast/storage/acme/challenges/;
        try_files $uri =404;
    }

    # ONLY public listener API → Neena
    location /api/public/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://neena_backend_public;
    }

    # Deny everything else on api host (no admin/private)
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen 4443 ssl;
    http2 on;
    server_name config.orairadio.in;

    ssl_certificate     /var/azuracast/storage/acme/ssl.crt;
    ssl_certificate_key /var/azuracast/storage/acme/ssl.key;

    location /.well-known/acme-challenge/ {
        alias /var/azuracast/storage/acme/challenges/;
        try_files $uri =404;
    }

    location = /app-config.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
        alias /var/azuracast/www_tmp/orai-app-config.json;
    }

    location / {
        return 404;
    }
}

# Command Center — owner admin UI + full /api (auth / unlock phrase gated in Neena).
# Entire host proxies to neena-backend (serves frontend StaticFiles + /api).
# Avoids Edge ERR_SSL_PROTOCOL_ERROR seen with large static+http2 on this vhost.
# See TRACK_A_ADMIN_SUBDOMAIN.md. Fallback: https://<vm>:8443
server {
    listen 80;
    listen 4443 ssl;
    server_name admin.orairadio.in;

    ssl_certificate     /var/azuracast/storage/acme/ssl.crt;
    ssl_certificate_key /var/azuracast/storage/acme/ssl.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_buffer_size     16k;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /.well-known/acme-challenge/ {
        alias /var/azuracast/storage/acme/challenges/;
        try_files $uri =404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://neena_backend_public;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen 4443 ssl;
    http2 on;
    server_name orairadio.in www.orairadio.in;

    ssl_certificate     /var/azuracast/storage/acme/ssl.crt;
    ssl_certificate_key /var/azuracast/storage/acme/ssl.key;

    location / {
        return 404;
    }
}
